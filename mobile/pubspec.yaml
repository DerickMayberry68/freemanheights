name: freeman_heights_mobile
description: Freeman Heights Church — Bus Transport & Check-In App
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.5.0

  # Freezed runtime
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Date formatting
  intl: ^0.19.0

  # Device location (GPS)
  geolocator: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Code generation
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
